name: CI

on:
  push:
    branches: [main, stage, develop]
  pull_request:
    branches: [main, stage, develop]
  workflow_dispatch:

jobs:
  validate-compose:
    name: Subir docker-compose e validar Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_USER: talherzim
      POSTGRES_PASSWORD: talherzim
      POSTGRES_DB: appdb

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar versão do Docker Compose
        run: docker compose version

      - name: Dar permissão de execução ao script
        run: chmod +x scripts/validate-compose.sh

      - name: Rodar validação
        run: ./scripts/validate-compose.sh

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color || true

  validate-dockerfile:
    name: Validar Docker-file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
  unit-tests:
    name: Rodar Testes Unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários
        run: npm test:unit

  lint:
    name: Rodar Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint
