openapi: 3.0.3

info:
  title: Talherzim API
  description: |
    Contrato da API do **Talherzim** — organizador de receitas com sugestão por
    ingredientes disponíveis.

    Inclui autenticação, despensa, sugestões, pesquisa e detalhes de receitas
    locais e externas. As receitas externas são consultadas na TheMealDB e os
    detalhes são traduzidos para português quando o serviço de tradução está disponível.

    ## Autenticação

    As rotas protegidas exigem o header `Authorization` com um token JWT no
    formato `Bearer`:

    ```http
    Authorization: Bearer <jwt>
    ```

    O token é obtido em `POST /auth/login` e deve ser enviado em todas as
    requisições a rotas protegidas. Requisições sem token, com token expirado ou
    inválido recebem `401` com o código estável `nao_autenticado` ou
    `token_invalido`.

    ## Formato de erro

    Todos os erros da API usam o mesmo envelope JSON:

    ```json
    {
      "erro": "codigo_estavel",
      "campos": [
        { "campo": "email", "mensagem": "E-mail inválido." }
      ]
    }
    ```

    - `erro` contém um código ou uma mensagem conforme a resposta documentada.
    - `campos` lista os erros de validação por campo e vem **vazia** quando o
      erro não é de validação (ex.: credenciais inválidas, token expirado).

    Consulte a descrição de cada resposta para os códigos possíveis.

    ## Segurança

    - Senhas **nunca** trafegam de volta nas respostas e são armazenadas com
      hash bcrypt (RNF02).
    - Cada usuário só acessa os próprios dados (RNF03).
  
  version: 1.1.0
  contact:
    name: Talhezim-Receitas-Rapidas
    url: https://github.com/Talhezim-Receitas-Rapidas
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Ambiente local de desenvolvimento
  - url: https://api.talherzim.example.com
    description: Produção (placeholder)

tags:
  - name: Autenticação
    description: Cadastro, login, logout e sessão do usuário (RF01, RF02).

paths:
  /auth/register:
    post:
      tags: [Autenticação]
      operationId: registrarUsuario
      summary: Cria uma conta de usuário
      description: |
        Cadastra um novo usuário com e-mail e senha (RF01). A senha é validada
        e armazenada com hash bcrypt (RNF02). O e-mail deve ser único.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              email: usuario@exemplo.com
              senha: senhaSegura123
      responses:
        '201':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: usuario@exemplo.com
        '409':
          $ref: '#/components/responses/EmailDuplicado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /auth/login:
    post:
      tags: [Autenticação]
      operationId: autenticarUsuario
      summary: Autentica o usuário e emite um token
      description: |
        Valida e-mail e senha e devolve um token JWT e os dados do usuário
        (RF02). O token deve ser usado nas rotas protegidas no header
        `Authorization: Bearer <jwt>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@exemplo.com
              senha: senhaSegura123
      responses:
        '200':
          description: Credenciais válidas; sessão iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                usuario:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  email: usuario@exemplo.com
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'

  /auth/logout:
    post:
      tags: [Autenticação]
      operationId: encerrarSessao
      summary: Encerra a sessão do usuário
      description: |
        Encerra a sessão autenticada (RF02). Como o token JWT é *stateless*, o
        cliente deve **descartar o token** localmente; o servidor invalida a
        sessão quando houver lista de revogação.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessão encerrada com sucesso. Sem corpo de resposta.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/me:
    get:
      tags: [Autenticação]
      operationId: obterUsuarioAtual
      summary: Retorna o usuário autenticado
      description: |
        Devolve os dados do usuário dono do token (RF02). Usado pelo front-end
        para restaurar a sessão e proteger rotas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: usuario@exemplo.com
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /ingredientes:
    get:
      summary: Lista a despensa do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ingredientes do usuário
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ingrediente' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      summary: Cadastra um ingrediente na despensa
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientePayload' }
      responses:
        '201':
          description: Ingrediente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingrediente' }
        '400': { $ref: '#/components/responses/JsonInvalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '422': { $ref: '#/components/responses/DadosInvalidos' }

  /ingredientes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Atualiza um ingrediente do usuário
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientePayload' }
      responses:
        '200':
          description: Ingrediente atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingrediente' }
        '400': { $ref: '#/components/responses/JsonInvalido' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/RecursoAusente' }
        '422': { $ref: '#/components/responses/DadosInvalidos' }
    delete:
      summary: Remove um ingrediente do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Ingrediente removido }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/RecursoAusente' }

  /receitas/sugeridas:
    get:
      summary: Lista sugestões da despensa ou pesquisa receitas por termo
      description: Sem detalhes, preserva a resposta em array. Com detalhes=true, inclui busca externa, pesquisa por termo e avisos com HTTP 200.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: detalhes
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: busca
          in: query
          required: false
          schema: { type: string, maxLength: 150 }
          example: pepino
      responses:
        '200':
          description: Resultado da consulta
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Receita' }
                  - type: object
                    required: [receitas, avisos, despensaVazia]
                    properties:
                      receitas:
                        type: array
                        items: { $ref: '#/components/schemas/Receita' }
                      avisos:
                        type: array
                        items: { type: string }
                      despensaVazia: { type: boolean }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '422':
          description: Busca inválida ou acima de 150 caracteres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /receitas/{id}:
    get:
      summary: Obtém os detalhes de uma receita local ou externa
      description: IDs do dataset permanecem aceitos após a importação. Falha de tradução preserva o original e acrescenta avisoTraducao.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: externa-53239
      responses:
        '200':
          description: Receita e detalhes disponíveis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receita' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/RecursoAusente' }
        '503':
          description: A fonte externa está indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtido em `POST /auth/login`. Envie no header:
        `Authorization: Bearer <jwt>`.

  schemas:
    IngredientePayload:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1, maxLength: 150 }
        quantidade: { type: number, minimum: 0, maximum: 99999999.99, nullable: true, description: Quantidade opcional. Valores positivos devem ser de pelo menos 0.01. }
        unidade: { type: string, maxLength: 20, nullable: true }

    Ingrediente:
      allOf:
        - $ref: '#/components/schemas/IngredientePayload'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            usuario_id: { type: string, format: uuid }

    Receita:
      type: object
      required: [id, nome, ingredientes]
      properties:
        id: { type: string }
        nome: { type: string }
        externa: { type: boolean }
        fonte: { type: string }
        fonte_id: { type: string, nullable: true }
        fonteUrl: { type: string, nullable: true }
        origem: { type: string, nullable: true }
        imagem: { type: string, nullable: true }
        imagem_url: { type: string, nullable: true }
        correspondencias: { type: integer, minimum: 0 }
        totalIngredientes: { type: integer, minimum: 0 }
        ingredienteConsultado: { type: string }
        idioma: { type: string, enum: [en, pt-BR] }
        traducaoAutomatica: { type: boolean }
        avisoTraducao: { type: string }
        ingredientes:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                required: [nome]
                properties:
                  nome: { type: string }
                  quantidade: { type: string }
        modo_preparo: { type: string, nullable: true }
        modoPreparo:
          type: array
          items: { type: string }

    Usuario:
      type: object
      description: Representação pública do usuário. Nunca inclui a senha.
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do usuário.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        email:
          type: string
          format: email
          description: E-mail cadastrado (único).
          example: usuario@exemplo.com

    RegistroRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@exemplo.com
        senha:
          type: string
          format: password
          minLength: 8
          description: |
            Mínimo de 8 caracteres. Armazenada com hash bcrypt (RNF02), nunca em
            texto puro.
          example: senhaSegura123

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@exemplo.com
        senha:
          type: string
          format: password
          example: senhaSegura123

    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          description: "JWT para uso no header `Authorization: Bearer <token>`."
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          $ref: '#/components/schemas/Usuario'

    Erro:
      type: object
      description: Envelope padrão de erro da API.
      required: [erro]
      properties:
        erro:
          type: string
          description: Código de erro ou mensagem descrita na resposta do endpoint.
          example: dados_invalidos
        campos:
          type: array
          description: |
            Erros de validação por campo. Vazio quando o erro não é de
            validação.
          items:
            $ref: '#/components/schemas/CampoErro'
          example:
            - campo: email
              mensagem: E-mail inválido.

    CampoErro:
      type: object
      required: [campo, mensagem]
      properties:
        campo:
          type: string
          description: Nome do campo com problema.
          example: email
        mensagem:
          type: string
          description: Descrição legível do problema.
          example: E-mail inválido.

  responses:
    JsonInvalido:
      description: JSON malformado. Código json_invalido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RecursoAusente:
      description: Recurso inexistente, ID inválido ou ingrediente de outro usuário
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    DadosInvalidos:
      description: |
        Payload inválido (campos ausentes, e-mail malformado ou senha curta).
        Código `dados_invalidos`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: dados_invalidos
            campos:
              - campo: email
                mensagem: E-mail inválido.
              - campo: senha
                mensagem: A senha deve ter ao menos 8 caracteres.

    EmailDuplicado:
      description: Já existe uma conta com o e-mail informado. Código `email_duplicado`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: email_duplicado
            campos: []

    CredenciaisInvalidas:
      description: E-mail ou senha incorretos. Código `credenciais_invalidas`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: credenciais_invalidas
            campos: []

    NaoAutenticado:
      description: |
        Requisição sem token, com token expirado ou inválido. Código
        `nao_autenticado` ou `token_invalido`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: nao_autenticado
            campos: []
