version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talherzim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talherzim
      POSTGRES_USER: talherzim
      POSTGRES_PASSWORD: talherzim123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talherzim -d talherzim"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
